<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeliard MASM Reference</title>
    <style>
        :root { color-scheme: dark; }
        html, body { margin: 0; min-height: 100%; background: #000; color: #c9c9c9; font-family: ui-monospace, Consolas, monospace; }
        main { min-height: 100vh; display: grid; place-items: center; gap: 10px; align-content: center; }
        #screen-container { width: 960px; height: 600px; overflow: hidden; background: #000; border: 1px solid #333; }
        #screen-container canvas { width: 960px !important; height: 600px !important; image-rendering: pixelated; image-rendering: crisp-edges; }
        #screen-container > div { display: none; }
        #status { font-size: 12px; opacity: 0.75; }
    </style>
</head>
<body>
    <main>
        <div id="screen-container"><div></div><canvas></canvas></div>
        <div id="status">preparing MASM release reference...</div>
    </main>
    <script type="module" src="/src/hybrid.ts"></script>
</body>
</html>
