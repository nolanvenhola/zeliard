<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeliard</title>
    <style>
        :root { color-scheme: dark; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; color: #ccc;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            overflow: hidden;
        }
        #stage {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; gap: 1em;
        }
        #screen-wrap { position: relative; }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 960px;          /* 320 * 3 — matches the MonoGame port window */
            height: 600px;
            background: #000;
            border: 1px solid #333;
            display: block;
        }
        #start {
            position: absolute; inset: 50% auto auto 50%;
            width: 56px; height: 56px; padding: 0;
            transform: translate(-50%, -50%);
            border: 1px solid #aaa; border-radius: 50%;
            background: #111; color: #fff;
            font-size: 24px; line-height: 1; cursor: pointer;
        }
        #start:hover { background: #222; border-color: #fff; }
        #start:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
        [hidden] { display: none !important; }
        #save-controls, #stored-save-controls, #game-controls {
            display: flex; gap: 8px; align-items: center;
        }
        #game-controls {
            flex-wrap: wrap; justify-content: center;
        }
        #game-stats {
            display: flex; gap: 14px; padding: 5px 10px;
            border: 1px solid #555; background: #080808;
        }
        #save-select, #audio-backend, #display-mode, #game-speed,
        #music-toggle, #sound-toggle, #load-save, #download-save, #restart, .file-button {
            height: 30px; border: 1px solid #777; border-radius: 2px;
            background: #111; color: #fff; font: inherit;
            box-sizing: border-box;
        }
        #save-select, #audio-backend, #display-mode { min-width: 160px; padding: 0 8px; }
        #game-speed { min-width: 52px; padding: 0 6px; }
        #music-toggle, #sound-toggle, #load-save, #download-save, #restart, .file-button {
            padding: 5px 12px; cursor: pointer;
        }
        #music-toggle[aria-pressed="false"], #sound-toggle[aria-pressed="false"] {
            color: #999; border-color: #555;
        }
    </style>
</head>
<body>
    <div id="stage">
        <div id="screen-wrap">
            <canvas id="screen" width="320" height="200"></canvas>
            <button id="start" type="button" title="Start opening demo" aria-label="Start opening demo" hidden>&#9654;</button>
        </div>
        <div id="game-controls" aria-label="Game settings and player status">
            <button id="music-toggle" type="button" aria-pressed="true">Music: On</button>
            <button id="sound-toggle" type="button" aria-pressed="true">Sound FX: On</button>
            <label>Speed
                <select id="game-speed" aria-label="Game speed">
                    <option value="0">0</option><option value="1">1</option>
                    <option value="2">2</option><option value="3">3</option>
                    <option value="4">4</option><option value="5">5</option>
                    <option value="6">6</option><option value="7">7</option>
                    <option value="8">8</option><option value="9">9</option>
                </select>
            </label>
            <span id="game-stats">
                <span>Level <output id="player-level">0</output></span>
                <span>Experience <output id="player-experience">0</output></span>
                <span>Next level <output id="player-experience-needed">0</output></span>
            </span>
        </div>
        <div id="save-controls">
            <label>Audio
                <select id="audio-backend" aria-label="Audio hardware">
                    <option value="0">AdLib (default)</option>
                    <option value="1">Roland MT-32</option>
                    <option value="2">PCjr / Tandy</option>
                    <option value="3">PC speaker</option>
                </select>
            </label>
            <label>Display
                <select id="display-mode" aria-label="Display hardware">
                    <option value="4">MCGA (default)</option>
                    <option value="0">EGA</option>
                    <option value="1">CGA 4-color</option>
                    <option value="2">CGA 2-color</option>
                    <option value="3">Hercules</option>
                    <option value="5">Tandy / PCjr</option>
                </select>
            </label>
            <button id="restart" type="button" hidden>Restart</button>
            <span id="stored-save-controls" hidden>
                <select id="save-select" aria-label="Saved game"></select>
                <button id="load-save" type="button">Load</button>
                <button id="download-save" type="button">Download .usr</button>
            </span>
            <label class="file-button" for="open-save">Open .usr</label>
            <input id="open-save" type="file" accept=".usr,application/octet-stream" hidden />
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
