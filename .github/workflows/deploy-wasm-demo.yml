name: Deploy WASM demo

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-wasm-demo.yml
      - 3_Assembly/dumps/zeliard_title_image.BIN
      - 3_Assembly/masm/working/zelres1/data/**
      - 3_Assembly/tasm/bin/zelres1/100OPDMO.bin
      - 6_WebPort/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.6
          actions-cache-folder: emsdk-cache

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 6_WebPort/shell/package-lock.json

      - name: Install shell dependencies
        working-directory: 6_WebPort/shell
        run: npm ci

      - name: Prepare reconstructed assets
        run: node 6_WebPort/scripts/copy_assets.mjs

      - name: Build WASM engine
        run: make -C 6_WebPort/engine wasm

      - name: Build public demo
        working-directory: 6_WebPort/shell
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 6_WebPort/shell/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
