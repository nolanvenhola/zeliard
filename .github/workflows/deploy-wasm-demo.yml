name: Deploy WASM demo

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-wasm-demo.yml
      - 3_Assembly/dumps/zeliard_title_image.BIN
      - 3_Assembly/masm/working/zelres1/data/**
      - 3_Assembly/masm/working/zelres1/code/105GDMCA.bin
      - 3_Assembly/masm/bin/zelres1/100OPDMO.bin
      - 1_OriginalGame/sndadlib.drv
      - 1_OriginalGame/mscadlib.drv
      - 6_WebPort/engine/third_party/8086tiny/**
      - 6_WebPort/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.6
          actions-cache-folder: emsdk-cache

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 6_WebPort/shell/package-lock.json

      - name: Install shell dependencies
        working-directory: 6_WebPort/shell
        run: npm ci

      - name: Prepare reconstructed assets
        run: node 6_WebPort/scripts/copy_assets.mjs

      - name: Run native parity suite
        run: make -C 6_WebPort/engine test-native

      - name: Verify parity evidence inventory
        run: |
          python 3_Assembly/masm/functest/classify.py
          git diff --exit-code -- 3_Assembly/masm/functest/coverage.csv
          python 3_Assembly/masm/functest/check_evidence_consistency.py

      - name: Build WASM engine
        run: make -C 6_WebPort/engine wasm

      - name: Verify exact runtime assets
        run: |
          test -f 6_WebPort/engine/assets/105GDMCA.bin
          test -f 6_WebPort/engine/assets/sndadlib.drv
          test -f 6_WebPort/engine/assets/mscadlib.drv
          test -f 6_WebPort/engine/assets/8086tiny-bios.bin
          test -f 6_WebPort/engine/assets/zopn.msd
          test -f 6_WebPort/engine/assets/zend.msd
          test -f 6_WebPort/engine/assets/stdply.bin
          test -f 6_WebPort/engine/assets/game.bin
          test -f 6_WebPort/engine/assets/gdmcga.bin
          test -f 6_WebPort/engine/assets/gtmcga.bin
          test -f 6_WebPort/engine/assets/town.bin
          test -f 6_WebPort/engine/assets/gfmcga.bin
          test -f 6_WebPort/engine/assets/fight.bin
          test -f 6_WebPort/engine/assets/select.bin
          test -f 6_WebPort/engine/assets/itemp.grp
          test -f 6_WebPort/engine/assets/magic.grp
          test -f 6_WebPort/engine/assets/sword.grp
          test -f 6_WebPort/engine/assets/mole.bin
          grep -a -q '105GDMCA.bin' 6_WebPort/engine/build/zeliard.js
          grep -a -q '/assets/game.bin' 6_WebPort/engine/build/zeliard.js
          grep -a -q '/assets/town.bin' 6_WebPort/engine/build/zeliard.js
          test ! -e 6_WebPort/shell/public/audio/zopn.ogg
          test ! -e 6_WebPort/shell/public/audio/zend.ogg
          test ! -e 6_WebPort/shell/public/audio/sfx_02.wav
          test ! -e 6_WebPort/shell/public/audio/sfx_04.wav
          test ! -e 6_WebPort/shell/public/audio/sfx_3d.wav
          test ! -e 6_WebPort/shell/public/audio/sfx_3e.wav
          test ! -e 6_WebPort/shell/public/audio/sfx_3f.wav
          test ! -e 6_WebPort/shell/public/audio/sfx_40.wav
          test ! -e 6_WebPort/shell/public/audio/sfx_41.wav

      - name: Build public demo
        working-directory: 6_WebPort/shell
        run: npm run build

      - name: Install browser parity runtime
        working-directory: 6_WebPort/shell
        run: npx playwright install --with-deps chromium

      - name: Run opening browser parity gate
        working-directory: 6_WebPort/shell
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/zeliard-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill $preview_pid' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/${{ github.event.repository.name }}/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/${{ github.event.repository.name }}/ > /dev/null
          node test_opening_audio_browser.mjs http://127.0.0.1:4173/${{ github.event.repository.name }}/
          node test_continuous_playthrough_browser.mjs http://127.0.0.1:4173/${{ github.event.repository.name }}/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 6_WebPort/shell/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
