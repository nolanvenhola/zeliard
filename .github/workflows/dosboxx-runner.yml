name: DOSBox-X runner

on:
  pull_request:
    paths:
      - .github/workflows/dosboxx-runner.yml
      - scripts/capture-opening-dosboxx.ps1
      - scripts/dosboxx/**
      - scripts/state/**
      - scripts/visual/**
      - 3_Assembly/masm/build_masm.py
  push:
    branches: [main]
    paths:
      - .github/workflows/dosboxx-runner.yml
      - scripts/capture-opening-dosboxx.ps1
      - scripts/dosboxx/**
      - scripts/state/**
      - scripts/visual/**
      - 3_Assembly/masm/build_masm.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pin-and-runner:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache approved DOSBox-X archive and executable
        uses: actions/cache@v5
        with:
          path: artifacts/dosboxx-cache
          key: dosboxx-${{ runner.os }}-${{ hashFiles('scripts/dosboxx/dosboxx-pin.json') }}

      - name: Verify runner logic and pinned DOSBox-X bytes
        shell: pwsh
        run: ./scripts/dosboxx/Test-ZeliardDosboxXRunner.ps1 -Provision

      - name: Verify raw framebuffer and palette diagnostics
        run: python -m unittest discover scripts/visual/tests -v

      - name: Run original-game startup smoke
        shell: pwsh
        run: ./scripts/dosboxx/Invoke-ZeliardDosboxX.ps1 -Action Smoke -Source original -CaptureRawVisual

      - name: Build the canonical MASM release
        shell: pwsh
        run: |
          $provision = (./scripts/dosboxx/Invoke-ZeliardDosboxX.ps1 -Action Provision | Out-String) |
            ConvertFrom-Json
          python ./3_Assembly/masm/build_masm.py --clean --workers 4 `
            --dosbox $provision.executable

      - name: Load every canonical fixture in original and MASM builds
        shell: pwsh
        run: |
          $fixtures = Get-ChildItem ./scripts/state/fixtures/valid/*.USR
          foreach ($source in 'original', 'masm') {
            foreach ($fixture in $fixtures) {
              $checkpoint = "usr-$source-$($fixture.BaseName.ToLowerInvariant())"
              ./scripts/dosboxx/Invoke-ZeliardDosboxX.ps1 -Action Smoke -Source $source `
                -SaveFile $fixture.FullName -CheckpointName $checkpoint `
                -CheckpointTimeoutSeconds 60
            }
          }
          $originalBase = Get-ChildItem ./artifacts/dosboxx-runs/original-*/capture/usr-original-base.png |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $masmBase = Get-ChildItem ./artifacts/dosboxx-runs/masm-*/capture/usr-masm-base.png |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $originalHash = (Get-FileHash $originalBase.FullName -Algorithm SHA256).Hash
          $masmHash = (Get-FileHash $masmBase.FullName -Algorithm SHA256).Hash
          [ordered]@{
            checkpoint = 'BASE'
            original = $originalHash
            masm = $masmHash
            exactMatch = $originalHash -eq $masmHash
            note = 'Asynchronous window capture; retained as evidence, not a frame gate.'
          } | ConvertTo-Json | Set-Content `
            ./artifacts/dosboxx-runs/base-visual-comparison.json

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dosboxx-runner-smoke
          path: artifacts/dosboxx-runs
          if-no-files-found: error
          retention-days: 14
